repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi, markdown]
  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.26
    hooks:
        - id: pymarkdown
          args:
              - --set
              - 'extensions.front-matter.enabled=$!True'
              - --disable-rules
              - line-length
              - scan
