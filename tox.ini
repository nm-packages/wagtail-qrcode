[tox]
skipsdist = True
usedevelop = True
skip_missing_interpreters = True

envlist = 
    py{311,312,313,314}-dj52-wt{74,80,81}-sqlite
    py{312,313,314}-dj60-wt{74,80,81}-sqlite
    py{312,313,314}-dj61-wt{80,81}-sqlite
    py315-dj61-wt81-sqlite
    py314-dj52-wt74-{postgres,mysql}
    py314-dj60-wt80-{postgres,mysql}
    py314-dj61-wt81-{postgres,mysql}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
    3.15: py315

[gh-actions:env]
DATABASE = 
    sqlite: sqlite
    postgres: postgres
    mysql: mysql

[testenv]
install_command = pip install -e ".[testing]" -U {opts} {packages}

passenv = DB_*
setenv =
    COVERAGE_FILE = {envtmpdir}/.coverage
    sqlite: DATABASE = sqlite
    postgres: DATABASE = postgres
    mysql: DATABASE = mysql

commands = 
    coverage run manage.py test --deprecation all {posargs: -v 2}
    coverage report -m

deps = 
    pyqrcode
    coverage

    dj52: Django>=5.2.8,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1.3,<6.2

    wt74: Wagtail>=7.4,<7.5
    wt80: Wagtail>=8.0,<8.1
    wt81: Wagtail>=8.1,<8.2

    postgres: psycopg2>=2.9.9
    mysql: mysqlclient>=2.2.1
