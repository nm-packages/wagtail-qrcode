[project]
name = "wagtail-qrcode"
version = "2.1.1"
description = "Create a QR code that can be used to link to a wagtail page"
readme = "README.md"
keywords = ["wagtail", "qrcode"]
authors = [
    {name = "Nick Moreton", email = "nickmoreton@me.com"}
]
license = {file = "LICENSE"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Framework :: Wagtail",
  "Framework :: Wagtail :: 7",
  "Framework :: Wagtail :: 8",
]
requires-python = ">=3.11"
dependencies =[
    "Wagtail>=7.4",
    "PyQRCode>=1,<2"
]

[project.optional-dependencies]
development = [
    "ruff==0.17.5",
]
testing = [
  "coverage"
]

[project.urls]
Repository = "https://github.com/wagtail-packages/wagtail-qrcode"
Issues = "https://github.com/wagtail-packages/wagtail-qrcode/issues"
Changelog = "https://github.com/nm-packages/wagtail-qrcode/blob/main/CHANGELOG.md"


[tool.ruff]
required-version = "==0.17.5"
target-version = "py311"
line-length = 88
force-exclude = true
extend-exclude = ["_build", "buck-out", "old", "bin"]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
# Leave indentation to the formatter; these checks can conflict with it.
ignore = ["E111", "E114", "E117", "W191"]
exclude = ["docs/"]

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["tests", "wagtail_qrcode"]
